name: Verify GTNH-VR Mixin crash fix

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/verify-mixin-fix.yml'
  push:
    branches: ['fix/mixinminecraft-injection-crash-2026-10']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify Mixin config and source
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("src/main/resources/mixins.gtnhvr.early.json").read_text())
          listed = set(config.get("mixins", []) + config.get("client", []))
          base = Path("src/main/java/com/gtnhvr/mixin/early")
          missing = sorted(name for name in listed if not (base / (name + ".java")).is_file())
          if missing:
              raise SystemExit("Mixin classes listed but missing from source: " + ", ".join(missing))
          source = (base / "MixinMinecraft.java").read_text()
          if "@ModifyArgs" in source and "gtnhvr$useVirtualGuiDimensions" in source:
              raise SystemExit("Fragile @ModifyArgs injection remains in MixinMinecraft")
          print(f"Mixin config OK: {len(listed)} listed classes exist; fragile injection absent.")
          PY
      - name: Build mod
        run: ./gradlew --no-daemon clean build
      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: gtnhvr-mixin-crash-fix
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
